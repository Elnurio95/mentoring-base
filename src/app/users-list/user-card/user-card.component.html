<div>
    <mat-card appearance="outlined"> 
        <mat-card-header>
            <mat-card-subtitle>{{user.name}}</mat-card-subtitle>
            <mat-card-subtitle>{{user.email}}</mat-card-subtitle>
            <mat-card-subtitle>{{user.website}}</mat-card-subtitle>
            <mat-card-subtitle>{{user.company.name}}</mat-card-subtitle>
            <mat-card-subtitle>{{user.phone | deleteDash }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-actions class="card__btns">
            <button mat-button (click)="openDeleteDialog()">УДАЛИТЬ</button>
            <button mat-button (click)="openEditDialog()">РЕДАКТИРОВАТЬ</button>                
        </mat-card-actions>
    </mat-card>    
</div>
